name: CI — Static Analysis

# Análisis estático determinista — sin IA, sin ANTHROPIC_API_KEY.
# El análisis semántico de seguridad ocurre en el hook pre-push (via LiteLLM local).

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install analysis tools
        run: pip install ruff mypy bandit pip-audit

      - name: ruff — linting + format check
        run: ruff check src/

      - name: mypy — type checking
        run: mypy src/ --ignore-missing-imports

      - name: bandit — security static analysis
        run: bandit -r src/ -ll   # solo severidad MEDIUM y HIGH

      - name: pip-audit — dependency vulnerabilities
        run: pip-audit
