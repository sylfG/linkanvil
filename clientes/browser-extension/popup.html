<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Enviar a Cerebro</title>
  <style>
    body { width: 250px; padding: 15px; font-family: Arial, sans-serif; text-align: center; }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-bottom: 10px; }
    button:hover { background: #218838; }
    .warning { color: #dc3545; display: none; margin-bottom: 10px; }
    #result { margin-top: 10px; font-weight: bold; }
    .link-config { display: block; margin-top: 10px; font-size: 12px; color: #007bff; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <h3>Inyectar a Cerebro</h3>
  <div id="warning-msg" class="warning">⚠️ Falta configuración. Abre las Opciones de la Extensión.</div>
  
  <button id="sendBtn">Inyectar URL Actual</button>
  <div id="result"></div>
  <span class="link-config" id="openSettings">Ir a Configuración</span>

  <script src="popup.js"></script>
</body>
</html>
