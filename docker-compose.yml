# =============================================================================
# LinkAnvil — Docker Compose
# =============================================================================
# Servicios: Traefik · RabbitMQ · Redis · PostgreSQL · Qdrant · n8n ·
#            LiteLLM · OpenTelemetry Collector · Prometheus · Grafana · Jaeger
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 🌍 INGESTION API
  #    Endpoint unificado asíncrono para ingesta de datos
  # ---------------------------------------------------------------------------
  ingestion-api:
    build:
      context: .
      dockerfile: infra/ingestion.Dockerfile
    container_name: cerebro-ingestion
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cerebro_redis_pass_CHANGE_ME}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cerebro}:${RABBITMQ_PASS:-cerebro_pass}@rabbitmq:5672/cerebro
    networks:
      - cerebro-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ingestion.rule=Host(`ingest.localhost`) || PathPrefix(`/ingest`)"
      - "traefik.http.routers.ingestion.middlewares=global-ratelimit@docker"
      - "traefik.http.services.ingestion.loadbalancer.server.port=8000"

  # ---------------------------------------------------------------------------
  # 🕷️ DYNAMIC SCRAPER WORKER
  #    Consumidor RabbitMQ -> Extractor -> Router AI
  # ---------------------------------------------------------------------------
  scraper-worker:
    build:
      context: .
      dockerfile: infra/scraper.Dockerfile
    container_name: cerebro-scraper
    restart: unless-stopped
    shm_size: '1gb'
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cerebro}:${RABBITMQ_PASS:-cerebro_pass}@rabbitmq:5672/cerebro
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerebro}:${POSTGRES_PASSWORD:-cerebro_db_pass}@postgres:5432/${POSTGRES_DB:-cerebro_brain}
    networks:
      - cerebro-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  outbox-worker:
    build:
      context: .
      dockerfile: infra/scraper.Dockerfile
    command: ["python", "-m", "src.data.outbox_publisher"]
    container_name: cerebro-outbox
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cerebro}:${RABBITMQ_PASS:-cerebro_pass}@rabbitmq:5672/cerebro
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerebro}:${POSTGRES_PASSWORD:-cerebro_db_pass}@postgres:5432/${POSTGRES_DB:-cerebro_brain}
    networks:
      - cerebro-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy

  embedder-worker:
    build:
      context: .
      dockerfile: infra/scraper.Dockerfile
    command: ["python", "-m", "src.data.embedder_worker"]
    container_name: cerebro-embedder
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-cerebro}:${RABBITMQ_PASS:-cerebro_pass}@rabbitmq:5672/cerebro
      # LITELLM_API_KEY could be injected from env here
      QDRANT_URL: http://qdrant:6333
      LITELLM_EMBEDDINGS_URL: http://litellm:4000/v1/embeddings
    networks:
      - cerebro-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_started
      litellm:
        condition: service_started
  cerebro-chat:
    build:
      context: .
      dockerfile: infra/ui.Dockerfile
    container_name: cerebro-chat
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      LITELLM_URL: "http://litellm:4000"
      QDRANT_URL: "http://qdrant:6333"
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-sk-cerebro-master-key}"
    networks:
      - cerebro-net
    depends_on:
      qdrant:
        condition: service_started
      litellm:
        condition: service_started
  # ---------------------------------------------------------------------------
  # 🔀 API GATEWAY — Traefik
  #    Rate limiting, enrutamiento dinámico, generación de Trace-ID
  # ---------------------------------------------------------------------------
  traefik:
    image: traefik:v3.1
    container_name: cerebro-traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.middlewares=global-ratelimit@docker,global-retry@docker"
      - "--entrypoints.websecure.address=:443"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.buckets=0.1,0.3,1.5,10.0"
      - "--tracing.otlp.http.endpoint=http://otel-collector:4318/v1/traces"
      - "--log.level=INFO"
    ports:
      - "80:80"
      - "8080:8080"   # Traefik Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.middlewares.global-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.global-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.global-retry.retry.attempts=3"
      - "traefik.http.middlewares.global-retry.retry.initialinterval=100ms"
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 📨 MESSAGE BUS — RabbitMQ
  #    Cola async de ingesta + Dead Letter Queues (DLQ) para URLs fallidas
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cerebro-rabbitmq
    hostname: cerebro-rabbitmq          # hostname fijo: evita cookie mismatch
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-cerebro}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-cerebro_pass}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-cerebro}
      RABBITMQ_ERLANG_COOKIE: cerebro_erlang_cookie_secret
      RABBITMQ_MANAGEMENT_DEFINITIONS_FILE: /etc/rabbitmq/definitions.json
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 20s
      timeout: 30s
      retries: 15
      start_period: 60s

  # ---------------------------------------------------------------------------
  # ⚡ CACHÉ & SESSION STORE — Redis
  #    Bloom Filter para deduplicación URL · Sesiones Redis con TTL
  #    Política allkeys-lru para evitar saturación de memoria
  # ---------------------------------------------------------------------------
  redis:
    image: redis/redis-stack-server:latest
    container_name: cerebro-redis
    restart: unless-stopped
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-cerebro_redis_pass} --maxmemory 512mb --maxmemory-policy allkeys-lru --save 60 1000 --appendonly yes"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-cerebro_redis_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 🗄️ BASE DE DATOS RELACIONAL — PostgreSQL
  #    Outbox Pattern · Row-Level Security (RLS) para Multi-Tenancy
  #    Tabla de cuarentena (Curador Nocturno)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: cerebro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cerebro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cerebro_db_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cerebro_brain}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cerebro} -d ${POSTGRES_DB:-cerebro_brain}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 🧠 BASE VECTORIAL — Qdrant
  #    Almacenamiento de embeddings con tenant_id filtrado
  #    Similitud del coseno para Colisionadores Semánticos (> 0.92)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: cerebro-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__LOG_LEVEL: INFO
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
      - ./infra/qdrant/config.yaml:/qdrant/config/production.yaml:ro
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qdrant.rule=Host(`qdrant.localhost`)"
      - "traefik.http.services.qdrant.loadbalancer.server.port=6333"

  # ---------------------------------------------------------------------------
  # 🤖 LLM GATEWAY — LiteLLM
  #    Fallback automático OpenAI → Anthropic → Local
  #    Circuit Breakers · Multi-provider routing
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: cerebro-litellm
    restart: unless-stopped
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-cerebro-master-key}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cerebro}:${POSTGRES_PASSWORD:-cerebro_db_pass}@postgres:5432/${POSTGRES_DB:-cerebro_brain}
      STORE_MODEL_IN_DB: "True"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-placeholder}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-sk-ant-placeholder}
    ports:
      - "4000:4000"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.litellm.rule=Host(`llm.localhost`)"
      - "traefik.http.services.litellm.loadbalancer.server.port=4000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health')\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 40s
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]

  # ---------------------------------------------------------------------------
  # 🔄 ORQUESTADOR DE WORKFLOWS — n8n
  #    Automatización de pipelines: Ingesta → Scraper → LLM → Store
  #    Curador Nocturno (cron jobs) · Bot Telegram integration
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:1.71.3
    container_name: cerebro-n8n
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-cerebro_brain}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-cerebro}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-cerebro_db_pass}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-cerebro_n8n_pass}
      N8N_HOST: n8n.localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n.localhost/
      QUEUE_BULL_REDIS_HOST: redis
      QUEUE_BULL_REDIS_PORT: 6379
      QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:-cerebro_redis_pass}
      N8N_METRICS: "true"
      NODE_ENV: production
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      EXECUTIONS_DATA_SAVE_ON_ERROR: "all"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      N8N_DIAGNOSTICS_ENABLED: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.localhost`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 60s

  # ---------------------------------------------------------------------------
  # 🔭 DISTRIBUTED TRACING — Jaeger
  #    Trace-ID por URL entrante · MTTR sub-milisegundo
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cerebro-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory        # Ephemeral: evita problemas de permisos en vol
      MEMORY_MAX_TRACES: 10000
    ports:
      - "16686:16686"   # Jaeger UI
      - "14317:4317"    # OTLP gRPC (host diferente para no colisionar con otel)
      - "14318:4318"    # OTLP HTTP
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jaeger.rule=Host(`jaeger.localhost`)"
      - "traefik.http.services.jaeger.loadbalancer.server.port=16686"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:16686/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 📡 OPENTELEMETRY COLLECTOR
  #    Centraliza trazas de todos los servicios → Jaeger + Prometheus
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: cerebro-otel
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"    # OTLP gRPC (recibe de servicios internos)
      - "4318:4318"    # OTLP HTTP
      - "8888:8888"    # Prometheus metrics del collector
      - "8889:8889"    # Prometheus exporter
    depends_on:
      - jaeger
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ---------------------------------------------------------------------------
  # 📊 MÉTRICAS — Prometheus
  #    Scrape de todos los servicios · Alertas de cuotas (Noisy Neighbor)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: cerebro-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # 📈 DASHBOARDS — Grafana
  #    Visualización de métricas RAG · Sesiones · Latencias · Costes LLM
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.4.0
    container_name: cerebro-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-cerebro_grafana_pass}
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_SERVER_ROOT_URL: http://grafana.localhost
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - cerebro-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 🐇 RABBIT MONITOR — RabbitMQ Exporter (adicional)
  #    Expone métricas RabbitMQ a Prometheus (colas DLQ, mensajes pendientes)
  # ---------------------------------------------------------------------------
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:latest
    container_name: cerebro-rabbitmq-exporter
    restart: unless-stopped
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: ${RABBITMQ_USER:-cerebro}
      RABBIT_PASSWORD: ${RABBITMQ_PASS:-cerebro_pass}
      PUBLISH_PORT: "9419"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9419/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 🔴 REDIS EXPORTER (adicional)
  #    Expone métricas Redis a Prometheus (memoria, TTL, evictions)
  # ---------------------------------------------------------------------------
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0-alpine
    container_name: cerebro-redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-cerebro_redis_pass}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9121/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ---------------------------------------------------------------------------
  # 🐘 POSTGRES EXPORTER (adicional)
  #    Expone métricas PostgreSQL a Prometheus (conexiones, transacciones)
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: cerebro-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-cerebro}:${POSTGRES_PASSWORD:-cerebro_db_pass}@postgres:5432/${POSTGRES_DB:-cerebro_brain}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cerebro-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9187/metrics || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

# =============================================================================
# PERSISTENT VOLUMES
# =============================================================================
volumes:
  rabbitmq-data:
  redis-data:
  postgres-data:
  qdrant-data:
  n8n-data:
  jaeger-data:
  prometheus-data:
  grafana-data:

# =============================================================================
# NETWORK — todos los servicios comparten la misma red interna
# =============================================================================
networks:
  cerebro-net:
    driver: bridge
    name: cerebro-net
