# Prometheus — Configuración de scraping
# LinkAnvil

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: 'segundo-cerebro'
    environment: 'local'

rule_files:
  - "/etc/prometheus/alert.rules.yml"

# Alerting (opcional, para producción)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

scrape_configs:
  # --- Prometheus self-monitoring ---
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # --- Traefik API Gateway ---
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
    metrics_path: /metrics

  # --- RabbitMQ ---
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq-exporter:9419']

  # --- Redis ---
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # --- PostgreSQL ---
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  # --- Qdrant ---
  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: /metrics

  # --- OpenTelemetry Collector ---
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888', 'otel-collector:8889']

  # --- n8n ---
  - job_name: 'n8n'
    static_configs:
      - targets: ['n8n:5678']
    metrics_path: /metrics

  # --- LiteLLM ---
  - job_name: 'litellm'
    static_configs:
      - targets: ['litellm:4000']
    metrics_path: /metrics
