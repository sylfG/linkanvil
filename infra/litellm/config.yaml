# LiteLLM Gateway - Cerebro
# Estrategia: Lite + Pro usando modelos gratuitos de NVIDIA NIM Preview
# Routing: least-busy (menos ocupado primero)
# Fallback automático al siguiente modelo si da error

model_list:
  # ---- GRUPO cerebro-lite: Modelos ligeros y rápidos ----
  - model_name: cerebro-lite
    litellm_params:
      model: openai/meta/llama-3.1-8b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: cerebro-lite
    litellm_params:
      model: openai/mistralai/mixtral-8x7b-instruct-v0.1
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY

  # ---- GRUPO cerebro-pro: Modelos grandes para razonamiento complejo ----
  - model_name: cerebro-pro
    litellm_params:
      model: openai/nvidia/llama-3.1-nemotron-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY

  - model_name: cerebro-pro
    litellm_params:
      model: openai/meta/llama-3.3-70b-instruct
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY

  # Embeddings - NVIDIA
  - model_name: cerebro-embeddings
    litellm_params:
      model: openai/nvidia/nv-embedqa-e5-v5
      api_base: https://integrate.api.nvidia.com/v1
      api_key: os.environ/NVIDIA_API_KEY
      encoding_format: "float"

litellm_settings:
  num_retries: 3
  request_timeout: 90
  retry_after: 3
  allowed_fails: 1
  cooldown_time: 15
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    supported_call_types: ["completion", "embedding"]
    ttl: 3600
  set_verbose: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  global_max_parallel_requests: 100
  max_budget: 50

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  timeout: 90
  retry_after: 3
  allowed_fails: 1
  cooldown_time: 15
