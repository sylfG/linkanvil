# Plantilla de config para LiteLLM. NO EDITAR a mano — se renderiza desde
# scripts/render-litellm-config.py leyendo .env + infra/litellm/providers.yaml.
# El archivo de salida (infra/litellm/config.yaml) está gestionado por up.sh.

model_list:
{{MODEL_LIST}}

litellm_settings:
  num_retries: 3
  request_timeout: 90
  retry_after: 3
  allowed_fails: 1
  cooldown_time: 15
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    supported_call_types: ["completion", "embedding"]
    ttl: 3600
  set_verbose: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  global_max_parallel_requests: 100
  max_budget: 50

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 90
  retry_after: 3
  allowed_fails: 1
  cooldown_time: 15
{{FALLBACKS}}
