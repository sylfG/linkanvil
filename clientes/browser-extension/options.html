<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Configuración de LinkAnvil</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; width: 300px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
    #status { margin-top: 15px; color: green; display: none; }
  </style>
</head>
<body>
  <h2>Configuración de LinkAnvil</h2>
  <div class="form-group">
    <label for="tenantId">Tenant ID (Ej: tenant123):</label>
    <input type="text" id="tenantId" placeholder="Introduce tu ID">
  </div>
  <div class="form-group">
    <label for="baseUrl">Gateway Base URL:</label>
    <input type="text" id="baseUrl" placeholder="Ej: http://ingest.localhost o https://...">
  </div>
  <button id="saveBtn">Guardar Configuración</button>
  <div id="status">¡Guardado correctamente!</div>

  <script src="options.js"></script>
</body>
</html>
