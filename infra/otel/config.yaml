# OpenTelemetry Collector — LinkAnvil
# Centraliza trazas de todos los microservicios
# Trace-ID generado por Traefik → viaja por toda la pipeline

receivers:
  # Recibe trazas de todos los servicios internos
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Métricas propias del collector
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8888']

processors:
  # Agrupación en lotes para eficiencia
  batch:
    timeout: 10s
    send_batch_size: 1024
  
  # Límites de memoria (evitar OOM)
  memory_limiter:
    check_interval: 5s
    limit_mib: 256
    spike_limit_mib: 128

  # Añadir atributos de entorno
  resource:
    attributes:
      - key: service.environment
        value: "local"
        action: insert
      - key: deployment.environment
        value: "docker-compose"
        action: insert

exporters:
  # Enviar trazas a Jaeger
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Métricas a Prometheus (push via remote write)
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: cerebro
    const_labels:
      environment: local

  # Debug: logs de trazas en consola (solo desarrollo)
  debug:
    verbosity: normal
    sampling_initial: 2
    sampling_thereafter: 500

service:
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888

  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
