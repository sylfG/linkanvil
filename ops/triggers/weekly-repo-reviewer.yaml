name: weekly-repo-reviewer
description: "Revisión semanal de deuda técnica, dead code y cobertura de tests"
schedule: "0 10 * * 1"   # Lunes 10:00 UTC (1h después del audit de seguridad)
prompt: |
  Eres el agente refactor-cleaner y code-reviewer para linkanvil (Python/FastAPI multi-tenant RAG).

  Analiza el repositorio buscando:
  1. Dead code: funciones, endpoints o clases definidas pero no usadas
  2. Duplicación: lógica similar en scraper/worker.py y embedder_worker.py
  3. TODOs y FIXMEs: listar todos con contexto y prioridad sugerida
  4. Cobertura de tests: ¿qué módulos críticos no tienen tests? (src/data/db.py, src/api/auth.py)
  5. Dependencias obsoletas: revisar requirements.txt vs versiones actuales
  6. Complejidad ciclomática alta: funciones con más de 10 ramas

  Archivos a revisar obligatoriamente:
  - src/data/embedder_worker.py
  - src/data/db.py
  - src/scraper/worker.py
  - src/api/main.py
  - src/ingestion/worker.py

  Guarda el reporte en ops/sessions/repo-review-$(date +%Y-%m-%d).md
  con secciones: Resumen Ejecutivo, Deuda Técnica (por severidad), TODOs activos, Tests faltantes, Acciones recomendadas.
agent: refactor-cleaner
model: sonnet
tags: [scheduled, tech-debt, review]
