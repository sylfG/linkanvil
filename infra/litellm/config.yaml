# LiteLLM Gateway - Cerebro
# Estrategia: Lite + Pro con modelos de OpenRouter
# Routing: least-busy (menos ocupado primero)
# Fallback automático al siguiente modelo si da error

model_list:
  # ---- GRUPO cerebro-lite: Modelos ligeros y rápidos ----
  - model_name: cerebro-lite
    litellm_params:
      model: openrouter/anthropic/claude-haiku-4.5
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cerebro-lite
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash
      api_key: os.environ/OPENROUTER_API_KEY

  # ---- GRUPO cerebro-pro: Modelos grandes para razonamiento complejo ----
  - model_name: cerebro-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-pro
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: cerebro-pro
    litellm_params:
      model: openrouter/deepseek/deepseek-r1
      api_key: os.environ/OPENROUTER_API_KEY

  # Embeddings - Qwen3 Embedding 8B
  - model_name: cerebro-embeddings
    litellm_params:
      model: openrouter/qwen/qwen3-embedding-8b
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  num_retries: 3
  request_timeout: 90
  retry_after: 3
  allowed_fails: 1
  cooldown_time: 15
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
    supported_call_types: ["completion", "embedding"]
    ttl: 3600
  set_verbose: false
  success_callback: []
  failure_callback: []

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  global_max_parallel_requests: 100
  max_budget: 50

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  timeout: 90
  retry_after: 3
  allowed_fails: 1
  cooldown_time: 15
